[mypy]
# Mypy configuration for geode_client
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True

# Allow gradual typing adoption
check_untyped_defs = False
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Be lenient with some issues during migration
warn_unused_ignores = False
no_implicit_optional = False

# Per-module overrides for external dependencies
[mypy-aioquic.*]
ignore_errors = True

[mypy-grpc.*]
ignore_errors = True

[mypy-google.protobuf.*]
ignore_errors = True

# Generated protobuf code - ignore errors
[mypy-geode_client.proto.*]
ignore_errors = True

[mypy-geode_client.client]
# The client module has complex protocol interactions that need gradual typing
# These issues require larger refactoring to fix properly
disable_error_code = assignment, override, attr-defined, var-annotated, no-any-return, union-attr

[mypy-geode_client.auth]
# The auth module needs to be updated for protobuf transport
# Temporarily ignore all errors until migration is complete
ignore_errors = True

[mypy-geode_client.types]
# Types module should be strict
warn_return_any = True

[mypy-geode_client.query_builder]
# Query builder is well-typed
warn_return_any = True

[mypy-geode_client.pool]
# Pool module is well-typed
warn_return_any = True

[mypy-geode_client.validate]
# Validation module should be strict
warn_return_any = True
disallow_untyped_defs = True

[mypy-geode_client.transport]
# Transport module has complex async patterns
disable_error_code = assignment, override, attr-defined, var-annotated, no-any-return
