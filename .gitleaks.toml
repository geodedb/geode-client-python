title = "Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist"
paths = [
  '''testdata''',
  '''tests/.*''',
  '''\.venv''',
  '''venv''',
  '''__pycache__''',
  '''\.pytest_cache''',
  '''\.mypy_cache''',
  '''.*\.py$''',
  '''.*\.md$''',
  '''.*\.log$''',
]
