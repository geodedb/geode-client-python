# =============================================================================
# Geode Python Client CI/CD Pipeline
# Uses DevNW CI/CD Catalog components
# =============================================================================

include:
  # Install dependencies and create virtual environment
  - component: gitlab.com/devnw/ci-catalog/python-install@a2054f9a5ee951bb49b5cccd8c17200901999c00
    inputs:
      tags: [company, linux, x86]
      stage: build
      python_version: "3.12"
      cache_lockfile: "requirements.txt"
      requirements_file: "requirements.txt"

  # Lint with black, ruff, and optionally mypy
  - component: gitlab.com/devnw/ci-catalog/python-lint@a2054f9a5ee951bb49b5cccd8c17200901999c00
    inputs:
      tags: [company, linux, x86]
      stage: lint
      python_version: "3.12"
      cache_lockfile: "requirements.txt"
      source_path: "geode_client/"
      run_black: false
      run_ruff: true
      run_mypy: false  # Enable when type hints are complete

  # One unit-test pass produces coverage and enforces the existing 80% gate.
  - component: gitlab.com/devnw/ci-catalog/python-coverage@a2054f9a5ee951bb49b5cccd8c17200901999c00
    inputs:
      tags: [company, linux, x86]
      stage: test
      python_version: "3.12"
      cache_lockfile: "requirements.txt"
      source_path: "geode_client"
      test_path: "tests/unit/"
      coverage_threshold: "80"
      output_dir: "coverage"

  # Benchmarks (using @main until released)
  - component: gitlab.com/devnw/ci-catalog/python-benchmark@a2054f9a5ee951bb49b5cccd8c17200901999c00
    inputs:
      tags: [company, linux, x86]
      stage: benchmark
      python_version: "3.12"
      cache_lockfile: "requirements.txt"
      benchmark_path: "benchmarks/"

  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: [company, linux, x86]

  # SBOM generation and scanning
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: [company, linux, x86]

  - component: gitlab.com/devnw/ci-catalog/sbom-scan@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: [company, linux, x86]

  # Release creation
  - component: gitlab.com/devnw/ci-catalog/release-semantic@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: [company, linux, x86]
      stage: release

  # PyPI Publishing (OIDC trusted publishing)
  - component: gitlab.com/devnw/ci-catalog/python-publish@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: [company, linux, x86]
      stage: publish
      python_version: "3.12"
      cache_lockfile: "requirements.txt"
      repository: "pypi"
      environment: "pypi"
      needs: "python-install"

workflow:
  # An open MR owns push validation; keep schedules, API, trigger,
  # parent pipelines, tags and manual runs admitted as before.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - when: always
  # SRE-172: a newer commit on the same ref cancels the superseded pipeline's
  # interruptible (validation) jobs. Release/deploy jobs stay non-interruptible.
  auto_cancel:
    on_new_commit: interruptible

default:
  # x86: the python:3.12 image is amd64-only. Jobs tagged only company,linux
  # land on the ARM GPU runners and die with "exec format error".
  tags:
    - company
    - linux
    - x86

stages:
  - build
  - lint
  - test
  - integration
  - security
  - sbom
  - benchmark
  - pages
  - release
  - publish

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PYTHONPATH: "$CI_PROJECT_DIR"

# Only Python jobs restore the environment and download cache.
.python-validation-cache:
  cache:
    key:
      prefix: python-3.12
      files: [requirements.txt]
    paths:
      - .cache/pip
      - .cache/uv
      - .venv/
    policy: pull

# Validate merge requests as well as the existing branch/tag pipelines.
# Jobs without rules are excluded from MR pipelines by GitLab's default.
python-install:
  rules:
    - when: on_success

python-lint:
  rules:
    - when: on_success

python-coverage:
  rules:
    - when: on_success

# =============================================================================
# SBOM overrides
# =============================================================================

sbom-generate:
  allow_failure: false

sbom-scan:
  allow_failure: false

# =============================================================================
# Type Checking (separate from lint for gradual adoption)
# =============================================================================

mypy:
  extends: .python-validation-cache
  rules:
    - when: on_success
  interruptible: true
  stage: lint
  image: registry.gitlab.com/devnw/ci-catalog/python:3.12
  before_script:
    - |
      if [ -d ".venv" ]; then
        source .venv/bin/activate
      fi
      # SEC-023: Pin mypy version to prevent supply chain attacks
      pip install "mypy>=1.0,<2.0"
  script:
    - mypy geode_client/ --ignore-missing-imports
  # Type checking is now enforced - mypy passes without errors
  needs:
    - python-install

# =============================================================================
# Property-based Tests
# =============================================================================

test:property:
  extends: .python-validation-cache
  interruptible: true
  stage: test
  image: registry.gitlab.com/devnw/ci-catalog/python:3.12
  before_script:
    - |
      if [ -d ".venv" ]; then
        source .venv/bin/activate
      else
        # Keep a cold-environment fallback for isolated job execution.
        pip install -r requirements.txt
      fi
      # SEC-023: Pin package versions to prevent supply chain attacks
      pip install "hypothesis>=6.0,<7.0" "pytest>=7.0,<9.0" "pytest-asyncio>=0.21,<1.0"
  script:
    - pytest tests/property/ -v --tb=short --junitxml=report-property.xml
  artifacts:
    when: always
    reports:
      junit: report-property.xml
    expire_in: 1 week
  needs:
    - job: python-install
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# =============================================================================
# Integration Tests (requires Geode server)
# =============================================================================

test:integration:
  extends: .python-validation-cache
  interruptible: true
  stage: integration
  image: registry.gitlab.com/devnw/ci-catalog/python:3.12
  services:
    - name: geodedb/geode:0.8.23@sha256:48a24f3739bda9017536cdd7b9b0c14474d0cc643d0b202560465d3834b9587a
      alias: geode
      command: ["serve", "--listen", "0.0.0.0:3141", "--log-level", "info", "--data-dir", "/data"]
  variables:
    GEODE_HOST: geode
    GEODE_PORT: "3141"
    # Disposable CI service: bootstrap the same account the clients use.
    GEODE_ADMIN_USERNAME: "geode"
    GEODE_USERNAME: "geode"
    GEODE_PASSWORD: "Correct horse battery staple" # gitleaks:allow
    GEODE_ADMIN_PASSWORD: "$GEODE_PASSWORD"
    GEODE_DEFAULT_PASSWORD: "$GEODE_PASSWORD"
    GEODE_METRICS_PORT: "9090"
    GEODE_METRICS_BIND: "0.0.0.0"
    HEALTHCHECK_TCP_PORT: "9090"
  before_script:
    - |
      if [ -d ".venv" ]; then
        source .venv/bin/activate
      fi
      pip install -e ".[dev]"
    - |
      # Wait for Geode server to be ready
      echo "Waiting for Geode server..."
      for i in $(seq 1 30); do
        if python -c "import urllib.request; urllib.request.urlopen('http://geode:9090/health', timeout=2).close()" 2>/dev/null; then
          echo "Geode server is ready"
          break
        fi
        if [ "$i" -eq 30 ]; then
          echo "Geode health endpoint did not become ready" >&2
          exit 1
        fi
        echo "Attempt $i: waiting..."
        sleep 2
      done
  script:
    - pytest tests/integration/ -v --tb=short --junitxml=report-integration.xml
  artifacts:
    when: always
    reports:
      junit: report-integration.xml
    expire_in: 1 week
  needs:
    - job: python-install
      artifacts: true
    - job: python-coverage
      artifacts: false
  allow_failure: true  # Allow failure until Geode server image is published
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG

# =============================================================================
# Documentation & Pages
# =============================================================================

pages:
  extends: .python-validation-cache
  interruptible: false
  stage: pages
  image: registry.gitlab.com/devnw/ci-catalog/python:3.12
  before_script:
    - |
      if [ -d ".venv" ]; then
        source .venv/bin/activate
      fi
      # SEC-023: Pin package versions to prevent supply chain attacks
      pip install "sphinx>=7.0,<9.0" "sphinx-rtd-theme>=2.0,<3.0"
  script:
    - |
      if [ -f "docs/Makefile" ]; then
        cd docs && make html
        mv _build/html ../public
      else
        mkdir -p public
        echo "<!DOCTYPE html><html><head><title>Geode Python Client</title></head>" > public/index.html
        echo "<body><h1>Geode Python Client</h1><p>API documentation coming soon.</p>" >> public/index.html
        echo "<p>See <a href='https://gitlab.com/devnw/codepros/geode/geode-client-python'>repository</a> for README.</p></body></html>" >> public/index.html
      fi
  artifacts:
    paths:
      - public
    expire_in: 1 week
  needs:
    - python-coverage
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# =============================================================================
# PyPI Publishing
# =============================================================================
# Publishing to PyPI uses OIDC trusted publishing for secure, tokenless auth.
# Configure trusted publisher at: https://pypi.org/manage/account/publishing/
#
# Required PyPI trusted publisher configuration:
#   - Namespace: devnw/codepros/geode
#   - Project: geode-client-python
#   - Workflow: .gitlab-ci.yml
#   - Environment: pypi

# Publish to PyPI (production releases only)
python-publish-pypi:
  needs:
    - python-install
    - python-coverage
  rules:
    # Automatically publish on semantic version tags (e.g., v1.0.0, v1.2.3-beta.1)
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/

# Publish to GitLab Package Registry (all version tags)
python-publish-gitlab:
  needs:
    - python-install
    - python-coverage
  rules:
    # On all version tags
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/

# Token-based publishing (fallback if OIDC fails)
python-publish-token:
  needs:
    - python-install
    - python-coverage
  rules:
    # Only when explicitly triggered and PYPI_TOKEN is set
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/ && $PYPI_TOKEN
      when: manual
      allow_failure: true
