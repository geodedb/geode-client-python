# =============================================================================
# Geode Python Client CI/CD Pipeline
# Uses DevNW CI/CD Catalog components
# =============================================================================

include:
  # Install dependencies and create virtual environment
  - component: gitlab.com/devnw/ci-catalog/python-install@v1.57.0
    inputs:
      tags: [company, linux, x86]
      stage: build
      python_version: "3.12"
      requirements_file: "requirements.txt"

  # Lint with black, ruff, and optionally mypy
  - component: gitlab.com/devnw/ci-catalog/python-lint@v1.57.0
    inputs:
      tags: [company, linux, x86]
      stage: lint
      python_version: "3.12"
      source_path: "geode_client/"
      run_black: false
      run_ruff: true
      run_mypy: false  # Enable when type hints are complete

  # Unit tests with pytest
  - component: gitlab.com/devnw/ci-catalog/python-test@v1.57.0
    inputs:
      tags: [company, linux, x86]
      stage: test
      python_version: "3.12"
      test_path: "tests/unit/"
      pytest_args: "-v --tb=short"
      coverage: false

  # Coverage reports (using @main until released)
  - component: gitlab.com/devnw/ci-catalog/python-coverage@v1.57.0
    inputs:
      tags: [company, linux, x86]
      stage: coverage
      python_version: "3.12"
      source_path: "geode_client"
      test_path: "tests/unit/"
      coverage_threshold: "80"
      output_dir: "coverage"

  # Benchmarks (using @main until released)
  - component: gitlab.com/devnw/ci-catalog/python-benchmark@v1.57.0
    inputs:
      tags: [company, linux, x86]
      stage: benchmark
      python_version: "3.12"
      benchmark_path: "benchmarks/"

  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.57.0
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.57.0
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.57.0
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.57.0
    inputs:
      tags: [company, linux, x86]

  # SBOM generation and scanning
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.57.0
    inputs:
      tags: [company, linux, x86]

  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.57.0
    inputs:
      tags: [company, linux, x86]

  # Release creation
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.57.0
    inputs:
      tags: [company, linux, x86]
      stage: release

  # PyPI Publishing (OIDC trusted publishing)
  - component: gitlab.com/devnw/ci-catalog/python-publish@v1.57.0
    inputs:
      tags: [company, linux, x86]
      stage: publish
      python_version: "3.12"
      repository: "pypi"
      environment: "pypi"
      needs: "python-install"

default:
  # x86: the python:3.12 image is amd64-only. Jobs tagged only company,linux
  # land on the ARM GPU runners and die with "exec format error".
  tags:
    - company
    - linux
    - x86

stages:
  - build
  - lint
  - test
  - integration
  - security
  - sbom
  - coverage
  - benchmark
  - pages
  - release
  - publish

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  PYTHONPATH: "$CI_PROJECT_DIR"

# Global cache for Python dependencies
cache:
  key: python-${CI_COMMIT_REF_SLUG}
  paths:
    - .pip-cache/
    - .venv/

# =============================================================================
# SBOM overrides
# =============================================================================

sbom-generate:
  allow_failure: false

sbom-scan:
  allow_failure: false

# =============================================================================
# Type Checking (separate from lint for gradual adoption)
# =============================================================================

mypy:
  stage: lint
  image: registry.gitlab.com/devnw/ci-catalog/python:3.12
  before_script:
    - |
      if [ -d ".venv" ]; then
        source .venv/bin/activate
      fi
      # SEC-023: Pin mypy version to prevent supply chain attacks
      pip install "mypy>=1.0,<2.0"
  script:
    - mypy geode_client/ --ignore-missing-imports
  # Type checking is now enforced - mypy passes without errors
  needs:
    - python-install

# =============================================================================
# Property-based Tests
# =============================================================================

test:property:
  stage: test
  image: registry.gitlab.com/devnw/ci-catalog/python:3.12
  before_script:
    - |
      if [ -d ".venv" ]; then
        source .venv/bin/activate
      else
        # MR pipelines have no python-install job (catalog jobs have no
        # merge_request_event rules), so install the pinned requirements here.
        pip install -r requirements.txt
      fi
      # SEC-023: Pin package versions to prevent supply chain attacks
      pip install "hypothesis>=6.0,<7.0" "pytest>=7.0,<9.0" "pytest-asyncio>=0.21,<1.0"
  script:
    - pytest tests/property/ -v --tb=short --junitxml=report-property.xml
  artifacts:
    when: always
    reports:
      junit: report-property.xml
    expire_in: 1 week
  # python-install only exists in branch/tag pipelines, not MR pipelines.
  needs:
    - job: python-install
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# =============================================================================
# Integration Tests (requires Geode server)
# =============================================================================

test:integration:
  stage: integration
  image: registry.gitlab.com/devnw/ci-catalog/python:3.12
  services:
    - name: geodedb/geode:latest
      alias: geode
      command: ["serve", "--listen", "0.0.0.0:3141", "--disable-auth", "--log-level", "info"]
  variables:
    GEODE_HOST: geode
    GEODE_PORT: "3141"
  before_script:
    - |
      if [ -d ".venv" ]; then
        source .venv/bin/activate
      fi
      pip install -e ".[dev]"
    - |
      # Wait for Geode server to be ready
      echo "Waiting for Geode server..."
      for i in $(seq 1 30); do
        if python -c "import socket; s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(1); s.connect(('geode', 3141)); s.close()" 2>/dev/null; then
          echo "Geode server is ready"
          break
        fi
        echo "Attempt $i: waiting..."
        sleep 2
      done
  script:
    - pytest tests/integration/ -v --tb=short --junitxml=report-integration.xml
  artifacts:
    when: always
    reports:
      junit: report-integration.xml
    expire_in: 1 week
  # python-install and python-test only exist in branch/tag pipelines.
  needs:
    - job: python-install
      optional: true
    - job: python-test
      optional: true
  allow_failure: true  # Allow failure until Geode server image is published
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG

# =============================================================================
# Documentation & Pages
# =============================================================================

pages:
  stage: pages
  image: registry.gitlab.com/devnw/ci-catalog/python:3.12
  before_script:
    - |
      if [ -d ".venv" ]; then
        source .venv/bin/activate
      fi
      # SEC-023: Pin package versions to prevent supply chain attacks
      pip install "sphinx>=7.0,<9.0" "sphinx-rtd-theme>=2.0,<3.0"
  script:
    - |
      if [ -f "docs/Makefile" ]; then
        cd docs && make html
        mv _build/html ../public
      else
        mkdir -p public
        echo "<!DOCTYPE html><html><head><title>Geode Python Client</title></head>" > public/index.html
        echo "<body><h1>Geode Python Client</h1><p>API documentation coming soon.</p>" >> public/index.html
        echo "<p>See <a href='https://gitlab.com/devnw/codepros/geode/geode-client-python'>repository</a> for README.</p></body></html>" >> public/index.html
      fi
  artifacts:
    paths:
      - public
    expire_in: 1 week
  needs:
    - python-coverage
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# =============================================================================
# PyPI Publishing
# =============================================================================
# Publishing to PyPI uses OIDC trusted publishing for secure, tokenless auth.
# Configure trusted publisher at: https://pypi.org/manage/account/publishing/
#
# Required PyPI trusted publisher configuration:
#   - Namespace: devnw/codepros/geode
#   - Project: geode-client-python
#   - Workflow: .gitlab-ci.yml
#   - Environment: pypi

# Publish to PyPI (production releases only)
python-publish-pypi:
  needs:
    - python-install
    - python-test
    - python-coverage
  rules:
    # Automatically publish on semantic version tags (e.g., v1.0.0, v1.2.3-beta.1)
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/

# Publish to GitLab Package Registry (all version tags)
python-publish-gitlab:
  needs:
    - python-install
    - python-test
  rules:
    # On all version tags
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/

# Token-based publishing (fallback if OIDC fails)
python-publish-token:
  needs:
    - python-install
    - python-test
    - python-coverage
  rules:
    # Only when explicitly triggered and PYPI_TOKEN is set
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/ && $PYPI_TOKEN
      when: manual
      allow_failure: true
