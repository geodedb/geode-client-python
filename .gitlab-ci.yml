# =============================================================================
# Geode Python Client CI/CD Pipeline
# Uses DevNW CI/CD Catalog components
# =============================================================================

include:
  # Install dependencies and create virtual environment
  - component: gitlab.com/devnw/ci-catalog/python-install@latest
    inputs:
      stage: build
      python_version: "3.12"
      requirements_file: "requirements.txt"

  # Lint with black, ruff, and optionally mypy
  - component: gitlab.com/devnw/ci-catalog/python-lint@latest
    inputs:
      stage: lint
      python_version: "3.12"
      source_path: "geode_client/"
      run_black: true
      run_ruff: true
      run_mypy: false  # Enable when type hints are complete

  # Unit tests with pytest
  - component: gitlab.com/devnw/ci-catalog/python-test@latest
    inputs:
      stage: test
      python_version: "3.12"
      test_path: "tests/unit/"
      pytest_args: "-v --tb=short"
      coverage: false

  # Coverage reports (using @main until released)
  - component: gitlab.com/devnw/ci-catalog/python-coverage@main
    inputs:
      stage: coverage
      python_version: "3.12"
      source_path: "geode_client"
      test_path: "tests/unit/"
      coverage_threshold: "80"
      output_dir: "coverage"

  # Benchmarks (using @main until released)
  - component: gitlab.com/devnw/ci-catalog/python-benchmark@main
    inputs:
      stage: benchmark
      python_version: "3.12"
      benchmark_path: "benchmarks/"

  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@latest
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@latest
    inputs:
      stage: security

stages:
  - build
  - lint
  - test
  - integration
  - security
  - coverage
  - benchmark
  - pages

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  PYTHONPATH: "$CI_PROJECT_DIR"

# Global cache for Python dependencies
cache:
  key: python-${CI_COMMIT_REF_SLUG}
  paths:
    - .pip-cache/
    - .venv/

# =============================================================================
# Type Checking (separate from lint for gradual adoption)
# =============================================================================

mypy:
  stage: lint
  image: registry.gitlab.com/devnw/ci-catalog/python:3.12
  before_script:
    - |
      if [ -d ".venv" ]; then
        source .venv/bin/activate
      fi
      pip install mypy
  script:
    - mypy geode_client/ --ignore-missing-imports
  allow_failure: true  # Gradual typing adoption
  needs:
    - python-install

# =============================================================================
# Property-based Tests
# =============================================================================

test:property:
  stage: test
  image: registry.gitlab.com/devnw/ci-catalog/python:3.12
  before_script:
    - |
      if [ -d ".venv" ]; then
        source .venv/bin/activate
      fi
      pip install hypothesis pytest pytest-asyncio
  script:
    - pytest tests/property/ -v --tb=short --junitxml=report-property.xml
  artifacts:
    when: always
    reports:
      junit: report-property.xml
    expire_in: 1 week
  needs:
    - python-install
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# =============================================================================
# Integration Tests (requires Geode server)
# =============================================================================

test:integration:
  stage: integration
  image: registry.gitlab.com/devnw/ci-catalog/python:3.12
  services:
    - name: registry.gitlab.com/devnw/codepros/geode/geode:latest
      alias: geode
      command: ["serve", "--listen", "0.0.0.0:3141", "--log-level", "info"]
  variables:
    GEODE_HOST: geode
    GEODE_PORT: "3141"
  before_script:
    - |
      if [ -d ".venv" ]; then
        source .venv/bin/activate
      fi
      pip install -e ".[dev]"
    - |
      # Wait for Geode server to be ready
      echo "Waiting for Geode server..."
      for i in $(seq 1 30); do
        if python -c "import socket; s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(1); s.connect(('geode', 3141)); s.close()" 2>/dev/null; then
          echo "Geode server is ready"
          break
        fi
        echo "Attempt $i: waiting..."
        sleep 2
      done
  script:
    - pytest tests/integration/ -v --tb=short --junitxml=report-integration.xml
  artifacts:
    when: always
    reports:
      junit: report-integration.xml
    expire_in: 1 week
  needs:
    - python-install
    - python-test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG

# =============================================================================
# Documentation & Pages
# =============================================================================

pages:
  stage: pages
  image: registry.gitlab.com/devnw/ci-catalog/python:3.12
  before_script:
    - |
      if [ -d ".venv" ]; then
        source .venv/bin/activate
      fi
      pip install sphinx sphinx-rtd-theme
  script:
    - |
      if [ -d "docs" ]; then
        cd docs && make html
        mv _build/html ../public
      else
        mkdir -p public
        echo "<!DOCTYPE html><html><head><title>Geode Python Client</title></head>" > public/index.html
        echo "<body><h1>Geode Python Client</h1><p>API documentation coming soon.</p>" >> public/index.html
        echo "<p>See <a href='https://gitlab.com/devnw/codepros/geode/geode-client-python'>repository</a> for README.</p></body></html>" >> public/index.html
      fi
  artifacts:
    paths:
      - public
    expire_in: 1 week
  needs:
    - python-coverage
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
