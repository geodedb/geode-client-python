# =============================================================================
# Geode Python Client CI/CD Pipeline
# Uses DevNW CI/CD Catalog components
# =============================================================================

include:
  - component: gitlab.com/devnw/ci-catalog/python-lint@latest
    inputs:
      stage: lint
      source_path: "geode_client/"
      allow_failure: false

  - component: gitlab.com/devnw/ci-catalog/python-install@latest
    inputs:
      stage: build
      python_version: "3.13"

stages:
  - lint
  - build
  - test
  - benchmark
  - coverage

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  PYTHONPATH: "$CI_PROJECT_DIR"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .pip-cache/
    - .venv/

# =============================================================================
# Lint Stage
# =============================================================================

mypy:
  stage: lint
  image: python:3.13
  before_script:
    - pip install mypy
  script:
    - mypy geode_client/ --ignore-missing-imports
  allow_failure: true  # Gradual typing adoption

# =============================================================================
# Test Stage - Unit Tests
# =============================================================================

test:unit:
  stage: test
  image: python:3.13
  before_script:
    - pip install -e ".[dev]"
  script:
    - pytest tests/unit/ -v --junitxml=report-unit.xml
  artifacts:
    when: always
    reports:
      junit: report-unit.xml
    paths:
      - report-unit.xml
    expire_in: 1 week

test:property:
  stage: test
  image: python:3.13
  before_script:
    - pip install -e ".[dev,property]"
  script:
    - pytest tests/property/ -v --junitxml=report-property.xml
  artifacts:
    when: always
    reports:
      junit: report-property.xml
    paths:
      - report-property.xml
    expire_in: 1 week

# =============================================================================
# Test Stage - Integration Tests (requires Geode server)
# =============================================================================

test:integration:
  stage: test
  image: python:3.13
  services:
    - name: registry.gitlab.com/devnw/geode/geode:latest
      alias: geode
      command: ["serve", "--listen", "0.0.0.0:3141", "--log-level", "info"]
  variables:
    GEODE_HOST: geode
    GEODE_PORT: "3141"
  before_script:
    - pip install -e ".[dev,integration]"
    - |
      # Wait for Geode server to be ready
      echo "Waiting for Geode server..."
      for i in $(seq 1 30); do
        if python -c "import socket; s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(1); s.connect(('geode', 3141)); s.close()" 2>/dev/null; then
          echo "Geode server is ready"
          break
        fi
        echo "Attempt $i: waiting..."
        sleep 2
      done
  script:
    - pytest tests/integration/ -v -m integration --junitxml=report-integration.xml
  artifacts:
    when: always
    reports:
      junit: report-integration.xml
    paths:
      - report-integration.xml
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG

# =============================================================================
# Benchmark Stage
# =============================================================================

benchmark:
  stage: benchmark
  image: python:3.13
  before_script:
    - pip install -e ".[dev,benchmark]"
  script:
    - pytest benchmarks/ --benchmark-only --benchmark-autosave --benchmark-json=benchmark-results.json
  artifacts:
    paths:
      - benchmark-results.json
      - .benchmarks/
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true

# =============================================================================
# Coverage Stage
# =============================================================================

coverage:
  stage: coverage
  image: python:3.13
  before_script:
    - pip install -e ".[dev]"
  script:
    - pytest tests/unit/ --cov=geode_client --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
      - coverage.xml
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# =============================================================================
# Documentation Stage (optional)
# =============================================================================

pages:
  stage: coverage  # Run after tests
  image: python:3.13
  before_script:
    - pip install -e ".[dev]"
    - pip install sphinx sphinx-rtd-theme
  script:
    - |
      # Generate documentation if docs/ exists
      if [ -d "docs" ]; then
        cd docs && make html
        mv _build/html ../public
      else
        mkdir -p public
        cp README.md public/index.md
        echo "# Geode Python Client" > public/index.html
        echo "<p>Documentation coming soon.</p>" >> public/index.html
      fi
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
