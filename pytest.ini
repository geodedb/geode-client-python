[pytest]
# Async test configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Test markers
markers =
    integration: marks tests as integration tests (requires Docker)
    benchmark: marks tests as benchmarks (run with --benchmark-only)
    property: marks tests as property-based tests (hypothesis)

# Default options
addopts = -v

# Test paths
testpaths = tests benchmarks

# Benchmark file patterns (bench_*.py)
python_files = test_*.py bench_*.py

# Ignore patterns
norecursedirs = .* build dist *.egg-info __pycache__

# Benchmark configuration (pytest-benchmark)
# Run benchmarks: pytest benchmarks/ --benchmark-only
# Skip benchmarks: pytest benchmarks/ --benchmark-skip
# Compare runs: pytest benchmarks/ --benchmark-compare
